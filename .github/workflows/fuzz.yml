name: Fuzz

# A longer fuzzing run than the one-minute smoke test in test.yml.
on:
  schedule:
    - cron: '17 3 * * 1' # Mondays at 03:17 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz, as a Go duration
        default: 20m

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '20m' }}
        run: go test -run '^$' -fuzz '^FuzzBTreeG$' -fuzztime "$FUZZTIME" .
      # A failing input is written to testdata/fuzz/FuzzBTreeG.  Commit it
      # there, so that plain `go test` keeps it as a regression test.
      - name: Upload failing fuzz input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure
          path: testdata/fuzz

name: Release

# Pushing a tag vX.Y.Z on a commit on master cuts release vX.Y.Z:
#
#   git tag -a v1.2.3 -m v1.2.3 && git push origin v1.2.3
#
# The tag is validated, the full test workflow runs on the tagged commit, and
# only if everything passes is a GitHub release created.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Never run two releases of the same tag at once.  The group name must differ
# from test.yml's, which is evaluated with this workflow's name when called.
concurrency:
  group: release-tag-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      module: ${{ steps.check.outputs.module }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check that the tagged commit is on master
      - name: Check tag format, branch and module path
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The trigger pattern is a glob; require exactly vMAJOR.MINOR.PATCH,
          # with no leading zeros and no pre-release or build suffix.
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          major=${BASH_REMATCH[1]}

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on master"
            exit 1
          fi

          # Go requires the module path of v2 and later to end in /vMAJOR.
          module=$(awk '$1 == "module" { print $2 }' go.mod)
          if (( major >= 2 )); then
            if [[ "$module" != */v"$major" ]]; then
              echo "::error::Tag '$TAG' needs module path ending in /v$major in go.mod, found '$module'"
              exit 1
            fi
          elif [[ "$module" =~ /v[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is v0 or v1, but module path '$module' has a major version suffix"
            exit 1
          fi
          echo "Releasing $module $TAG from $GITHUB_SHA"
          echo "module=$module" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: validate
    uses: ./.github/workflows/test.yml

  release:
    name: Create release
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Ask the module proxy for the new version, so that it is available to
      # `go get` and shows up on pkg.go.dev without waiting for a first user.
      - name: Publish to the Go module proxy
        env:
          TAG: ${{ github.ref_name }}
          MODULE: ${{ needs.validate.outputs.module }}
          GOPROXY: https://proxy.golang.org
        run: |
          cd "$(mktemp -d)"
          go list -m "$MODULE@$TAG"
